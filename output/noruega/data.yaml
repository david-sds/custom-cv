projects:
  - name: "Hyper Focus Frontend"
    url: "https://github.com/hyper-focus-adhd/hyper-focus-frontend"
    description: "Frontend para plataforma de assistência TDAH com rede social, gerenciamento de tarefas e funcionalidades em tempo real."
    highlights:
      - "Construiu SPA React 18 com Vite apresentando fórum (comunidades, postagens, comentários), calendário de tarefas e notas baseadas em quadro."
      - "Implementou chat em tempo real usando Socket.io com gerenciamento de estado Redux e tokens de autenticação persistentes."
      - "Integrou FullCalendar para agendamento de tarefas com visualizações de calendário/lista/tabela e gerenciamento de eventos por data."
      - "Configurou deploy no Firebase Hosting com pipeline CI/CD GitHub Actions (preview em PR, deploy em merge)."
    technologies:
      - "React"
      - "Vite"
      - "Redux Toolkit"
      - "React Router"
      - "Socket.io"
      - "FullCalendar"
      - "Bootstrap"
      - "Formik"
      - "Axios"
      - "Firebase Hosting"
      - "GitHub Actions"

  - name: "Notion Clone"
    url: "https://github.com/david-sds/notion_clone"
    description: "Aplicação full-stack offline-first de gerenciamento de documentos com arquitetura de sincronização em tempo real."
    highlights:
      - "Construiu API REST com NestJS (TypeScript) com CRUD de documentos e endpoint de sincronização baseado em operações."
      - "Implementou sistema de sincronização offline-first com pushes debounced e retry automático."
      - "Projetou camada de persistência local usando Drift (SQLite) com fila de operações e rastreamento de estado de sincronização."
      - "Modeou banco de dados PostgreSQL com Prisma ORM; containerizou ambiente de desenvolvimento local com Docker Compose."
    technologies:
      - "NestJS"
      - "Flutter"
      - "TypeScript"
      - "Dart"
      - "PostgreSQL"
      - "Prisma ORM"
      - "Drift (SQLite)"
      - "Docker"
      - "Freezed"
      - "GoRouter"
      - "Provider"

