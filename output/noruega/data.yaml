      - "Projetou e gerenciou banco de dados MySQL com Prisma ORM, implementando modelos de dados e migrações."
      - "Otimizou performance do backend com estratégias de cache, paginação e endpoints de filtragem dinâmica."
      - "Implementou sistema de permissões no backend com controle de acesso baseado em funções granular."
