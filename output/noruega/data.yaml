work:
  - name: "Desenvolvedor Full-Stack (Colaborador Part-time)"
    location: "Fagundez Tecnologia - HOTMILK"
    startDate: 2026-01-01
    summary: "Responsável pela consolidação de infraestrutura, migração de CI/CD, integração LMS com autenticação SSO e desenvolvimento de plugins personalizados."
    highlights:
      - "Migrou pipeline de CI/CD de GitLab CI para GitHub Actions, otimizando fluxos de deploy."
      - "Consolidou infraestrutura de duas instâncias VPS (Hostgator) para uma única VPS (Hostinger), reduzindo custos e simplificando gerenciamento."
      - "Automatizou provisionamento e manutenção de servidor Linux usando Docker e scripts Bash personalizados."
      - "Orquestrou deploy de múltiplas aplicações (frontend, backend, Moodle, Keycloak) usando Docker e Nginx reverse proxy para ambientes de produção e desenvolvimento."
      - "Integrou aplicação Flutter com Moodle via API de Web Services do Moodle para sincronização de dados."
      - "Desenvolveu plugins PHP personalizados para Moodle para habilitar funcionalidades de gamificação e melhorar a experiência do usuário."

  - name: "Desenvolvedor Full-Stack (Bolsa de Pesquisa)"
    location: "Fagundez Tecnologia - HOTMILK"
    startDate: 2025-01-01
    endDate: 2025-12-31
    summary: "Liderou desenvolvimento full-stack com foco em otimização de performance no backend, sistema de auditoria, permissões e melhorias de UX no frontend."
    highlights:
