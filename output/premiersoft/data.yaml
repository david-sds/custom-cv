work:
  - name: "Desenvolvedor Fullstack"
    location: "Fagundez Tecnologia - HOTMILK"
    startDate: 2026-01-01
    summary: "Responsável por consolidação de infraestrutura, migração CI/CD, integração LMS com autenticação SSO e desenvolvimento de plugins customizados."
    highlights:
      - "Migrou pipeline CI/CD de GitLab CI para GitHub Actions, otimizando workflows de deploy."
      - "Consolidou infraestrutura de duas instâncias VPS para uma única VPS, reduzindo custos e simplificando gestão."
      - "Automatizou provisionamento e manutenção de servidor Linux usando Docker e scripts Bash customizados."
      - "Orquestrou deploy multi-app (frontend, backend, Moodle, Keycloak) com Docker e Nginx reverse proxy para ambientes de produção e desenvolvimento."
      - "Integrou Moodle LMS com aplicação Flutter via Moodle Web Services API para sincronização de dados."
      - "Migrou sistema de autenticação JWT self-emitted para Keycloak como provedor de identidade centralizado."
      - "Desenvolveu plugins PHP customizados para Moodle com funcionalidades de gamificação."

  - name: "Desenvolvedor Fullstack (Bolsa de Pesquisa)"
    location: "Fagundez Tecnologia - HOTMILK"
    startDate: 2025-01-01
    endDate: 2025-12-31
    summary: "Liderou desenvolvimento full-stack com foco em otimização de performance backend, logging de auditoria e melhorias de UX no frontend."
    highlights:
      - "Liderou desenvolvimento full-stack em módulos frontend (Flutter) e backend (NestJS)."
      - "Projetou e gerenciou banco de dados MySQL com Prisma ORM, implementando modelos de dados e migrações."
      - "Otimizou performance backend com estratégias de cache, paginação e endpoints de filtragem dinâmica."
      - "Implementou HTTP audit com interceptors e logging para sucesso e falhas."
      - "Refatorou sistema de permissões backend com controle de acesso baseado em papéis granular."
      - "Construiu listas paginadas no frontend com busca, filtros com cache e estados de carregamento otimizados."
      - "Manteve pipeline CI/CD usando GitLab CI."

  - name: "Desenvolvedor Frontend (Bolsa de Pesquisa)"
    location: "Fagundez Tecnologia - HOTMILK"
    startDate: 2023-05-01
    endDate: 2024-12-31
    summary: "Estabeleceu arquitetura frontend Flutter e desenvolveu módulos principais incluindo autenticação, onboarding, gestão de projetos e relatórios."
    highlights:
      - "Liderou arquitetura inicial do frontend com Flutter, definindo estrutura do projeto e biblioteca de componentes reutilizáveis."
      - "Migrou sistema de roteamento para GoRouter com navegação declarativa e guards de rota."
      - "Construiu fluxo de autenticação multi-perfis com acesso baseado em papéis, recuperação de senha e gestão de perfis."
      - "Implementou sistema de onboarding com formulários multi-step, validação e acompanhamento de progresso."
      - "Desenvolveu módulos CRUD para templates de projetos com recursos, anexos e integração com agendamento."
      - "Criou sistema de gestão de tarefas com atribuição de grupo, envio de arquivos e acompanhamento de status."
      - "Implementou listas paginadas com busca, cache de filtros e estados de carregamento skeleton."
      - "Integrou APIs REST backend com tratamento de erros, retry logic e UI otimista."

