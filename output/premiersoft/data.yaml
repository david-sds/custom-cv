projects:
  - name: "Notion Clone"
    url: "https://github.com/david-sds/notion_clone"
    description: "Aplicação full-stack de gestão de documentos offline-first com arquitetura de sincronização em tempo real."
    highlights:
      - "Construiu REST API com NestJS (TypeScript) com CRUD de documentos e endpoint de sincronização baseado em operações."
      - "Implementou sistema de sincronização offline-first com pushes debounced e retry automático."
      - "Projetou camada de persistência local usando Drift (SQLite) com fila de operações e rastreamento de estado de sincronização."
      - "Criou frontend Flutter cross-platform (Web, Android, Linux) com arquitetura MVVM e gerenciamento de estado via Provider."
      - "Modelou banco PostgreSQL com Prisma ORM; containerizou ambiente de dev local com Docker Compose."
    technologies:
      - "NestJS"
      - "Flutter"
      - "TypeScript"
      - "Dart"
      - "PostgreSQL"
      - "Prisma ORM"
      - "Drift (SQLite)"
      - "Docker"
      - "Freezed"
      - "GoRouter"
      - "Provider"

  - name: "Conéctar CRUD"
    url: "https://github.com/david-sds/conectar-crud"
    description: "Sistema full-stack de gestão de clientes com autenticação JWT e controle de acesso baseado em papéis."
    highlights:
      - "Desenvolveu REST API com NestJS com CRUD usuário/cliente, auth JWT (access + refresh tokens) e guards baseados em papéis (ADMIN/USER)."
      - "Implementou fluxo de autenticação seguro com hash bcrypt, persistência de refresh token e autorização em nível de rota."
      - "Construiu frontend Flutter Web com arquitetura MVVM, roteamento declarativo (GoRouter) e modelos imutáveis via Freezed."
      - "Projetou schema PostgreSQL com Prisma ORM incluindo relacionamentos many-to-many usuário-cliente e modelagem de endereço."
    technologies:
      - "NestJS"
      - "Flutter"
      - "TypeScript"
      - "Dart"
      - "PostgreSQL"
      - "Prisma ORM"
      - "JWT"
      - "bcrypt"
      - "Docker"
      - "Freezed"
      - "GoRouter"
      - "Provider"

  - name: "Hyper Focus Frontend"
    url: "https://github.com/hyper-focus-adhd/hyper-focus-frontend"
    description: "Frontend para plataforma de assistência a ADHD com rede social, gestão de tarefas e features em tempo real."
    highlights:
      - "Construiu React 18 SPA com Vite com fórum (comunidades, posts, comentários), calendário de tarefas e board de notas."
      - "Implementou chat em tempo real usando Socket.io com gerenciamento de estado Redux e tokens de auth persistentes."
      - "Integrou FullCalendar para agendamento de tarefas com visualizações calendário/lista/tabela e gerenciamento de eventos por data."
      - "Configurou deploy Firebase Hosting com pipeline CI/CD GitHub Actions (preview em PR, deploy em merge)."
    technologies:
      - "React"
      - "Vite"
      - "Redux Toolkit"
      - "React Router"
      - "Socket.io"
      - "FullCalendar"
      - "Bootstrap"
      - "Formik"
      - "Axios"
      - "Firebase Hosting"
      - "GitHub Actions"
      - "react-intl"

