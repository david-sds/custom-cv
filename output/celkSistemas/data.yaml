      - "Desenvolveu API REST com NestJS com CRUD usuário/cliente, autenticação JWT (access + refresh tokens) e guards baseados em papéis (ADMIN/USER)."
      - "Implementou fluxo de autenticação seguro com hash bcrypt de senhas, persistência de refresh token e autorização a nível de rota."
      - "Construiu frontend Flutter Web com arquitetura MVVM, roteamento declarativo (GoRouter) e modelos imutáveis via Freezed."
      - "Projetou schema PostgreSQL com Prisma ORM incluindo relacionamentos muitos-para-muitos usuário-cliente e modelagem de endereço."
