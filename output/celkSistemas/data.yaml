projects:
  - name: "Notion Clone"
    url: "https://github.com/david-sds/notion_clone"
    description: "Aplicação full-stack de gestão de documentos offline-first com arquitetura de sincronização em tempo real."
    highlights:
      - "Construiu API REST com NestJS (TypeScript) com CRUD de documentos e endpoint de sincronização baseado em operações."
      - "Implementou sistema de sincronização offline-first com push com debounce e retry automático."
      - "Projetou camada de persistência local usando Drift (SQLite) com fila de operações e rastreamento de estado de sincronização."
      - "Criou frontend Flutter multi-plataforma (Web, Android, Linux) com arquitetura MVVM e gerenciamento de estado Provider."
      - "Modelou banco de dados PostgreSQL com Prisma ORM; containerizou ambiente de desenvolvimento local com Docker Compose."
