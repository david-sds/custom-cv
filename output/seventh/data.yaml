projects:
  - name: "Notion Clone"
    url: "https://github.com/david-sds/notion_clone"
    description: "Aplicação full-stack de gerenciamento de documentos offline-first com arquitetura de sincronização em tempo real."
    highlights:
      - "Construiu API REST com NestJS (TypeScript) com CRUD de documentos e endpoint de sync baseado em operações."
      - "Implementou sistema de sync offline-first com push debounced e retry automático."
      - "Criou frontend Flutter cross-platform (Web, Android, Linux) com arquitetura MVVM e gerenciamento de estado com Provider."
      - "Modeou banco de dados PostgreSQL com Prisma ORM; containerizou ambiente de dev com Docker Compose."
    technologies:
      - "NestJS"
      - "Flutter"
      - "TypeScript"
      - "Dart"
      - "PostgreSQL"
      - "Prisma ORM"
      - "Drift (SQLite)"
      - "Docker"
      - "Freezed"
      - "GoRouter"
      - "Provider"

