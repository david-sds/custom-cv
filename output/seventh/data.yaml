    url: "https://github.com/david-sds/conectar-crud"
    description: "Sistema full-stack de gerenciamento de clientes com autenticação JWT e controle de acesso baseado em roles."
    highlights:
      - "Desenvolveu API REST com NestJS com CRUD user/client, auth JWT (access + refresh tokens) e guards baseados em roles (ADMIN/USER)."
      - "Implementou fluxo seguro de autenticação com hash bcrypt, persistência de refresh token e autorização a nível de rota."
      - "Construiu frontend Flutter Web com arquitetura MVVM, roteamento declarativo (GoRouter) e modelos imutáveis via Freezed."
      - "Criou biblioteca reutilizável de componentes UI (paginação, dropdowns, autocomplete, skeleton loading)."
