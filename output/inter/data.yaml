projects:
  - name: "Notion Clone"
    url: "https://github.com/david-sds/notion_clone"
    description: "Aplicativo offline-first de gerenciamento de documentos com arquitetura de sincronização em tempo real."
    highlights:
      - "API REST com NestJS (TypeScript) com CRUD de documentos e endpoint de sincronização baseado em operações."
      - "Sistema de sincronização offline-first com pushes debounced e retry automático."
      - "Camada de persistência local usando Drift (SQLite) com fila de operações e tracking de estado de sincronização."
      - "Frontend Flutter cross-platform (Web, Android, Linux) com arquitetura MVVM e Provider state management."
      - "Modelagem de banco PostgreSQL com Prisma ORM; containerização com Docker Compose."
    technologies:
      - "NestJS"
      - "Flutter"
      - "TypeScript"
      - "Dart"
      - "PostgreSQL"
      - "Prisma ORM"
      - "Drift (SQLite)"
      - "Docker"
      - "Freezed"
      - "GoRouter"
      - "Provider"

  - name: "Conéctar CRUD"
    url: "https://github.com/david-sds/conectar-crud"
    description: "Sistema de gerenciamento de clientes com autenticação JWT e controle de acesso baseado em roles."
    highlights:
      - "API REST com NestJS com CRUD de usuário/cliente, autenticação JWT (access + refresh tokens) e role-based guards (ADMIN/USER)."
      - "Fluxo de autenticação seguro com bcrypt, persistência de refresh token e autorização em nível de rota."
      - "Frontend Flutter Web com arquitetura MVVM, roteamento declarativo (GoRouter) e modelos imutáveis via Freezed."
      - "Schema PostgreSQL com Prisma ORM incluindo relacionamentos muitos-para-muitos e modelagem de endereços."
      - "Biblioteca de componentes UI reutilizáveis (paginação, dropdowns, autocomplete, skeleton loading)."
    technologies:
      - "NestJS"
      - "Flutter"
      - "TypeScript"
      - "Dart"
      - "PostgreSQL"
      - "Prisma ORM"
      - "JWT"
      - "bcrypt"
      - "Docker"
      - "Freezed"
      - "GoRouter"
      - "Provider"

  - name: "Flutter Games"
    url: "https://github.com/david-sds/flutter_games"
    description: "Coleção de jogos clássicos de puzzle cross-platform construídos com Flutter."
    highlights:
      - "Implementação de Minesweeper com 4 níveis de dificuldade, algoritmo flood-fill e sistema de flags."
      - "Sudoku com geração procedural de tabuleiro e lógica de validação."
      - "Gerenciamento de estado reativo com MobX e code generation para observable stores."
      - "Layouts responsivos adaptando-se à orientação da tela com cálculos customizados de células."
      - "Deploy em 6 plataformas: Web, Android, iOS, Linux, macOS e Windows."
    technologies:
      - "Flutter"
      - "Dart"
      - "MobX"
      - "GoRouter"

