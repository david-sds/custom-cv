      - "API REST com NestJS com CRUD user/client, autenticação JWT (access + refresh tokens) e guards por papéis (ADMIN/USER)."
      - "Fluxo de autenticação seguro com hash bcrypt, persistência de refresh token e autorização a nível de rota."
      - "Frontend Flutter Web com MVVM, roteamento declarativo (GoRouter) e modelos imutáveis via Freezed."
      - "Schema PostgreSQL com Prisma ORM incluindo relacionamentos many-to-many e modelagem de endereços."
    technologies:
