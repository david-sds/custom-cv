projects:
  - name: "Clone do Notion"
    url: "https://github.com/david-sds/notion_clone"
    description: "Aplicação full-stack de gerenciamento de documentos offline-first com arquitetura de sincronização em tempo real."
    highlights:
      - "Construiu API REST com NestJS (TypeScript) com CRUD de documentos e endpoint de sincronização baseado em operações."
      - "Implementou sistema de sincronização offline-first com push com debounce e retry automático."
      - "Projetou camada de persistência local usando Drift (SQLite) com fila de operações e rastreamento de estado de sincronização."
      - "Criou frontend Flutter multiplataforma (Web, Android, Linux) com arquitetura MVVM e gerenciamento de estado Provider."
    technologies:
      - "NestJS"
      - "Flutter"
      - "TypeScript"
      - "Dart"
      - "PostgreSQL"
      - "Prisma ORM"
      - "Drift (SQLite)"
      - "Docker"

  - name: "CRUD Conéctar"
    url: "https://github.com/david-sds/conectar-crud"
    description: "Sistema full-stack de gestão de clientes com autenticação JWT e controle de acesso baseado em papéis."
    highlights:
      - "Desenvolveu API REST com NestJS com CRUD de usuários/clientes, auth JWT (access + refresh tokens) e guards baseados em papéis (ADMIN/USER)."
      - "Implementou fluxo seguro de autenticação com hash bcrypt, persistência de refresh token e autorização a nível de rota."
      - "Construiu frontend Flutter Web com arquitetura MVVM, roteamento declarativo (GoRouter) e modelos imutáveis via Freezed."
      - "Projetou schema PostgreSQL com Prisma ORM incluindo relacionamentos muitos-para-muitos e modelagem de endereços."
    technologies:
      - "NestJS"
      - "Flutter"
      - "TypeScript"
      - "Dart"
      - "PostgreSQL"
      - "Prisma ORM"
      - "JWT"
      - "bcrypt"
      - "Docker"

  - name: "Hyper Focus Frontend"
    url: "https://github.com/hyper-focus-adhd/hyper-focus-frontend"
    description: "Frontend para plataforma de assistência a ADHD com rede social, gestão de tarefas e recursos em tempo real."
    highlights:
      - "Construiu SPA React 18 com Vite com fórum (comunidades, posts, comentários), calendário de tarefas e quadros de notas."
      - "Implementou chat em tempo real usando Socket.io com gerenciamento de estado Redux e tokens de autenticação persistentes."
      - "Integrou FullCalendar para agendamento de tarefas com visualizações calendário/lista/tabela e gerenciamento de eventos por data."
      - "Configurou deploy no Firebase Hosting com pipeline CI/CD GitHub Actions (preview em PR, deploy em merge)."
    technologies:
      - "React"
      - "Vite"
      - "Redux Toolkit"
      - "React Router"
      - "Socket.io"
      - "FullCalendar"
      - "Bootstrap"
      - "Formik"
      - "Axios"
      - "Firebase Hosting"
      - "GitHub Actions"

  - name: "EduSymf"
    url: "https://github.com/david-sds/edu_symf"
    description: "Sistema multi-tenant de gestão escolar para escolas públicas e privadas brasileiras."
    highlights:
      - "Projetou arquitetura modular com 10+ módulos planejados: matrículas, disciplinas, avaliações, frequência e boletins."
      - "Implementou entidade Usuário com 7 tipos de papéis (Admin da Plataforma até Pai), callbacks de ciclo de vida Doctrine ORM e exclusão suave."
      - "Construiu operações CRUD com Symfony Forms, templates Twig e proteção CSRF."
      - "Modelou banco de dados PostgreSQL com Doctrine Migrations e containerização Docker."
    technologies:
      - "Symfony"
      - "PHP"
      - "Twig"
      - "Doctrine ORM"
      - "PostgreSQL"
      - "Docker"
      - "Composer"

  - name: "Custom CV"
    url: "https://github.com/david-sds/custom-cv"
    description: "Ferramenta CLI com IA para gerar currículos e cartas de apresentação personalizadas a partir de descrições de vagas."
    highlights:
      - "Construiu fluxo interativo de shell que recebe descrições de vagas e gera currículos personalizados usando IA."
      - "Projetou esquema de currículo YAML como fonte única de verdade com template Typst para compilação PDF."
      - "Implementou sistema de diretório de saída por vaga organizando descrições de vagas, dados personalizados e PDFs gerados."
      - "Integrou OpenCode CLI para adaptação de currículo com IA com revisão por diff Git antes da compilação final."
    technologies:
      - "Bash"
      - "YAML"
      - "Typst"
      - "jq"
      - "OpenCode CLI"

