      - "react-intl"

  - name: "EduSymf"
    url: "https://github.com/david-sds/edu_symf"
    description: "Sistema de gerenciamento escolar multi-tenant para escolas públicas e privadas brasileiras."
    highlights:
      - "Projetou arquitetura modular com 10+ módulos planejados: matrulas, disciplinas, avaliações, frequência e boletins."
      - "Implementou entidade User com 7 tipos de papéis (Admin da Plataforma a Pai), callbacks de lifecycle Doctrine ORM e soft deletes."
      - "Construiu operações CRUD com Symfony Forms, templates Twig e proteção CSRF."
      - "Modelou banco de dados PostgreSQL com Doctrine Migrations e containerização Docker."
      - "Planejou integração BNCC (padrões curriculares brasileiros) para tag de habilidades de avaliação."
    technologies:
      - "Symfony"
