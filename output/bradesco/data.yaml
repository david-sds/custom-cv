projects:
  - name: "Clone do Notion"
    url: "https://github.com/david-sds/notion_clone"
    description: "Aplicação full-stack de gerenciamento de documentos offline-first com arquitetura de sincronização em tempo real."
    highlights:
      - "Construiu API REST com NestJS (TypeScript) com CRUD de documentos e endpoint de sincronização baseado em operações."
      - "Implementou sistema de sincronização offline-first com pushes debounced e retry automático."
      - "Projetou camada de persistência local usando Drift (SQLite) com fila de operações e acompanhamento de estado de sincronização."
      - "Criou frontend Flutter cross-platform (Web, Android, Linux) com arquitetura MVVM e gerenciamento de estado Provider."
      - "Modelou banco de dados PostgreSQL com Prisma ORM; containerizou ambiente de dev local com Docker Compose."
    technologies:
      - "NestJS"
      - "Flutter"
      - "TypeScript"
      - "Dart"
      - "PostgreSQL"
      - "Prisma ORM"
      - "Drift (SQLite)"
      - "Docker"
      - "Freezed"
      - "GoRouter"
      - "Provider"

  - name: "Conéctar CRUD"
    url: "https://github.com/david-sds/conectar-crud"
    description: "Sistema full-stack de gerenciamento de clientes com autenticação JWT e controle de acesso baseado em papéis."
    highlights:
      - "Desenvolveu API REST com NestJS com CRUD usuário/cliente, auth JWT (access + refresh tokens) e guards baseados em papéis (ADMIN/USER)."
      - "Implementou fluxo de autenticação seguro com hash bcrypt, persistência de refresh token e autorização em nível de rota."
      - "Construiu frontend Flutter Web com arquitetura MVVM, roteamento declarativo (GoRouter) e modelos imutáveis via Freezed."
      - "Projetou schema PostgreSQL com Prisma ORM incluindo relacionamentos many-to-many usuário-cliente e modelagem de endereço."
      - "Criou biblioteca de componentes UI reutilizáveis (paginação, dropdowns, autocomplete, estados de skeleton loading)."
    technologies:
      - "NestJS"
      - "Flutter"
      - "TypeScript"
      - "Dart"
      - "PostgreSQL"
      - "Prisma ORM"
      - "JWT"
      - "bcrypt"
      - "Docker"
      - "Freezed"
      - "GoRouter"
      - "Provider"

  - name: "Hyper Focus Frontend"
    url: "https://github.com/hyper-focus-adhd/hyper-focus-frontend"
    description: "Frontend para plataforma de assistência ADHD com rede social, gerenciamento de tarefas e funcionalidades em tempo real."
    highlights:
      - "Construiu SPA React 18 com Vite com fórum (comunidades, posts, comentários), calendário de tarefas e quadros de notas."
      - "Implementou chat em tempo real usando Socket.io com gerenciamento de estado Redux e tokens de autenticação persistentes."
      - "Integrou FullCalendar para agendamento de tarefas com visualizações calendário/lista/tabela e gerenciamento de eventos por data."
      - "Criou testes de auto-avaliação ADHD com acompanhamento de histórico e visualização de resultados."
      - "Configurou deploy Firebase Hosting com pipeline CI/CD GitHub Actions (preview em PR, deploy em merge)."
    technologies:
      - "React"
      - "Vite"
      - "Redux Toolkit"
      - "React Router"
      - "Socket.io"
      - "FullCalendar"
      - "Bootstrap"
      - "Formik"
      - "Axios"
      - "Firebase Hosting"
