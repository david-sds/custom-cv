      - "Twig"
      - "Doctrine ORM"
      - "PostgreSQL"
      - "Docker"
      - "Composer"

  - name: "Custom CV"
    url: "https://github.com/david-sds/custom-cv"
    description: "Ferramenta CLI com IA para gerar currículos e cartas de apresentação personalizadas a partir de descrições de vagas."
    highlights:
      - "Construiu fluxo interativo de shell que aceita descrições de vagas e gera currículos customizados usando IA."
      - "Projetou esquema de currículo YAML como única fonte de verdade com template Typst para compilação PDF."
      - "Implementou sistema de diretório de saída por vaga organizando descrições, dados customizados e PDFs gerados."
      - "Integrou OpenCode CLI para adaptação de currículo com IA com revisão Git diff antes da compilação final."
      - "Criou script de instalação para setup seamlessly como skill de IA com symlinks para configuração do agente."
    technologies:
      - "Bash"
      - "YAML"
      - "Typst"
      - "jq"
      - "OpenCode CLI"

  - name: "Dotfiles"
    url: "https://github.com/david-sds/dotfiles"
    description: "Configuração de ambiente de desenvolvimento pessoal para Neovim, Tmux e ferramentas CLI."
    highlights:
      - "Construiu configuração modular Neovim em Lua com setups LSP para 15+ linguagens e coleções customizadas de snippets."
      - "Configurou Tmux com vim motions, keybindings customizados e integração lazygit para fluxo de terminal."
      - "Criou script de instalação para symlinking de configurações em múltiplas máquinas."
      - "Implementou scripts de sincronização baseados em git para push/pull de mudanças entre ambientes de desenvolvimento."
      - "Integrou assistentes de codificação com IA (OpenCode, Codex e Claude) com configuração baseada em permissões."
    technologies:
