projects:
  - name: "Notion Clone"
    url: "https://github.com/david-sds/notion_clone"
    description: "Aplicação full-stack de gerenciamento de documentos offline-first com arquitetura de sincronização em tempo real."
    highlights:
      - "Construí API REST com NestJS (TypeScript) com CRUD de documentos e endpoint de sincronização baseado em operações."
      - "Implementei sistema de sincronização offline-first com pushes debounced e retry automático."
      - "Projetei camada de persistência local usando Drift (SQLite) com fila de operações e rastreamento de estado de sincronização."
      - "Criei frontend Flutter cross-platform (Web, Android, Linux) com arquitetura MVVM e gerenciamento de estado com Provider."
    technologies:
      - "NestJS"
      - "Flutter"
      - "TypeScript"
      - "Dart"
      - "PostgreSQL"
      - "Prisma ORM"
      - "Drift (SQLite)"
      - "Docker"

  - name: "Conéctar CRUD"
    url: "https://github.com/david-sds/conectar-crud"
    description: "Sistema full-stack de gestão de clientes com autenticação JWT e controle de acesso baseado em papéis."
    highlights:
      - "Desenvolvi API REST com NestJS com CRUD usuário/cliente, auth JWT (access + refresh tokens) e guards baseados em papéis (ADMIN/USER)."
      - "Implementei fluxo de autenticação seguro com hash bcrypt, persistência de refresh tokens e autorização a nível de rota."
      - "Construí frontend Flutter Web com arquitetura MVVM, roteamento declarativo (GoRouter) e modelos imutáveis via Freezed."
    technologies:
      - "NestJS"
      - "Flutter"
      - "TypeScript"
      - "Dart"
      - "PostgreSQL"
      - "Prisma ORM"
      - "JWT"
      - "Docker"

  - name: "Hyper Focus Frontend"
    url: "https://github.com/hyper-focus-adhd/hyper-focus-frontend"
    description: "Frontend para plataforma de assistência ADHD com rede social, gestão de tarefas e funcionalidades em tempo real."
    highlights:
      - "Construí SPA React 18 com Vite com fórum (comunidades, posts, comentários), calendário de tarefas e notas baseadas em board."
      - "Implementei chat em tempo real usando Socket.io com gerenciamento de estado Redux e tokens de autenticação persistentes."
      - "Configurei deploy Firebase Hosting com pipeline CI/CD GitHub Actions (preview em PR, deploy em merge)."
    technologies:
      - "React"
      - "Vite"
      - "Redux Toolkit"
      - "React Router"
      - "Socket.io"
      - "Firebase Hosting"
      - "GitHub Actions"

  - name: "EduSymf"
    url: "https://github.com/david-sds/edu_symf"
    description: "Sistema de gestão escolar multi-tenant para escolas públicas e privadas brasileiras."
    highlights:
      - "Projetei arquitetura modular com 10+ módulos: matrículas, disciplinas, avaliações, frequência e boletins."
      - "Implementei entidade User com 7 tipos de papéis, callbacks de ciclo de vida Doctrine ORM e soft deletes."
      - "Modelei banco PostgreSQL com Doctrine Migrations e containerização Docker."
    technologies:
      - "Symfony"
      - "PHP"
      - "Doctrine ORM"
      - "PostgreSQL"
      - "Docker"

