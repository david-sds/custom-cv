      - "Automatizei provisionamento e manutenção de servidor Linux com Docker e scripts Bash customizados."
      - "Orquestrei deploy multi-aplicação (frontend, backend, Moodle, Keycloak) com Docker e Nginx reverse proxy para ambientes de produção e desenvolvimento."
      - "Desenvolvi plugins PHP customizados para Moodle com funcionalidades de gamificação."
      - "Integrei aplicativo Flutter com Moodle via API Moodle Web Services para sincronização de dados."
      - "Migrei sistema JWT self-emitted para Keycloak como provedor de identidade centralizado."

  - name: "Desenvolvedor Full-Stack (Bolsa de Pesquisa)"
