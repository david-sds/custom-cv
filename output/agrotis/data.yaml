      - "Dart"
      - "PostgreSQL"
      - "Prisma ORM"
      - "JWT"
      - "bcrypt"
      - "Docker"

  - name: "Custom CV"
    url: "https://github.com/david-sds/custom-cv"
    description: "Ferramenta CLI com IA para geração de currículos e cartas de apresentação personalizadas a partir de descrições de vagas."
    highlights:
      - "Construi fluxo de shell interativo que recebe descrições de vagas e gera currículos customizados usando IA."
      - "Projetei esquema YAML de currículo como única fonte de verdade com template Typst para compilação PDF."
      - "Implementei sistema de diretório de saída por vaga organizando descrições, dados customizados e PDFs gerados."
      - "Integrei OpenCode CLI para adaptação de currículo com revisão via Git diff antes da compilação final."
    technologies:
      - "Bash"
      - "YAML"
      - "Typst"
      - "jq"
      - "OpenCode CLI"

