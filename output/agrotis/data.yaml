projects:
  - name: "Hyper Focus Frontend"
    url: "https://github.com/hyper-focus-adhd/hyper-focus-frontend"
    description: "Frontend para plataforma de assistência ADHD com rede social, gestão de tarefas e recursos em tempo real."
    highlights:
      - "Construí SPA React 18 com Vite apresentando fórum (comunidades, posts, comentários), calendário de tarefas e notas baseadas em quadros."
      - "Implementei chat em tempo real usando Socket.io com gerenciamento de estado Redux e tokens de autenticação persistentes."
      - "Integrei FullCalendar para agendamento de tarefas com visualizações calendário/lista/tabela."
      - "Configurei implantação Firebase Hosting com pipeline CI/CD GitHub Actions (preview em PR, deploy em merge)."
    technologies:
      - "React"
      - "Vite"
      - "Redux Toolkit"
      - "React Router"
      - "Socket.io"
      - "FullCalendar"
      - "Bootstrap"
      - "Formik"
      - "Axios"
      - "Firebase Hosting"
      - "GitHub Actions"

  - name: "Conéctar CRUD"
    url: "https://github.com/david-sds/conectar-crud"
    description: "Sistema full-stack de gestão de clientes com autenticação JWT e controle de acesso baseado em papéis."
    highlights:
      - "Desenvolvi API REST com NestJS apresentando CRUD usuário/cliente, autenticação JWT (access + refresh tokens) e guards baseados em papéis (ADMIN/USER)."
      - "Implementei fluxo seguro de autenticação com hash bcrypt, persistência de refresh token e autorização a nível de rota."
      - "Construí frontend Flutter Web com arquitetura MVVM, roteamento declarativo (GoRouter) e modelos imutáveis via Freezed."
      - "Projetei schema PostgreSQL com Prisma ORM incluindo relacionamentos muitos-para-muitos e modelagem de endereço."
    technologies:
